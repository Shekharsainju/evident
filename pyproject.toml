[project]
name = "evident"
version = "0.1.0"
description = "Evidence-grounded career outputs: every claim traces to a confirmed fact."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "pydantic>=2",
    "pydantic-settings",
    "google-genai>=2.3.0",
    "pdfplumber",
    "pytesseract",
    "rapidfuzz",
    "pillow",
    "numpy",
    "playwright",
    "python-pptx",
    "scipy",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evident"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["evident"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pypdfium2.*", "pytesseract.*", "pptx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: makes real model calls (uses free-tier quota or the local GPU)"]
addopts = "-m 'not live'"
